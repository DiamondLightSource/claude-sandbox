# The PyPI front door for claude-sandbox (ADR 23). This directory is the
# ONLY Python packaging in the repository, and it holds no sandbox logic:
# the wheel ships the bash launcher and installer verbatim as package data,
# and the one Python module execs them. Build with `uv build --wheel`
# from this directory; the version comes from the git tag (hatch-vcs, the
# same setuptools_scm mechanism the DLS python-copier template uses), so the
# wheel and the image tag are the same release by construction.
[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "claude-sandbox"
dynamic = ["version"]
description = "Sandboxed Claude Code, Codex and Pi: a bubblewrap jail with an egress allowlist, via uvx"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/DiamondLightSource/claude-sandbox"
Documentation = "https://diamondlightsource.github.io/claude-sandbox/"

[project.scripts]
claude-sandbox = "claude_sandbox:main"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "src/claude_sandbox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sandbox"]

# The shipped tree mirrors the repository layout, because the `install`
# shim locates `install.sh` relative to itself and `install.sh` locates the
# conf and the statusline script relative to the repo root.
[tool.hatch.build.targets.wheel.force-include]
"../../install" = "claude_sandbox/tree/install"
"../../container/claude-container" = "claude_sandbox/tree/container/claude-container"
"../../.devcontainer/claude-sandbox" = "claude_sandbox/tree/.devcontainer/claude-sandbox"
"../../.devcontainer/claude-sandbox.conf" = "claude_sandbox/tree/.devcontainer/claude-sandbox.conf"
"../../.claude/statusline-command.sh" = "claude_sandbox/tree/.claude/statusline-command.sh"
"../../skills" = "claude_sandbox/tree/skills"
