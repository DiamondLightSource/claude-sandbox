# Publish the claude-sandbox wheel to PyPI on every release tag (ADR 23).
# The wheel is the uvx front door: it bundles the bash launcher and
# installer verbatim, and its version is read from the launcher's VERSION
# line, which container.yml asserts equals the tag. Trusted publishing
# (OIDC): no PyPI token is stored in this repository.
name: PyPI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel packaging/pypi -o dist

      # One release number (ADR 23). Compared against the VERSION= line, not
      # the wheel filename: PyPI normalises a prerelease tag such as
      # 4.0.0-beta.1 to 4.0.0b1, and the hyphen is what keeps the install
      # shim's newest-stable filter from picking a beta.
      - name: Assert the tag is the launcher's VERSION line
        if: github.ref_type == 'tag'
        run: |
          v="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' container/claude-container)"
          test "$v" = "${{ github.ref_name }}"
          ls dist/claude_sandbox-*.whl

      - name: Publish to PyPI
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@release/v1
